name: Skylos Code Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    name: Code Audit & Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Skylos
        run: pip install skylos

      - name: Run Skylos Security & Quality Audit
        run: skylos . --danger --quality --secrets
